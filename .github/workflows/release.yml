# GEC Uplink — cross-platform release + updater build.
#
# Trigger: push a tag matching v*  (e.g.  git tag v0.2.0 && git push origin v0.2.0).
# Result: one GitHub Release for that tag with the per-OS installers attached AND
# the updater manifest (latest.json), which the app reads to self-update.
#
# Shape (draft -> publish, required by spec 2026-07-14 §3 after the dev.7 incident):
#   create-release  -> build (mac/linux/windows matrix) -> publish-release
#                        \-> flatpak (opt-in, artifact-only)
#   cleanup-failed-run  (if: failure() || cancelled())
# The release is a DRAFT for the whole build, so nothing is publicly downloadable
# until every platform has uploaded; publishing is what fires the mirror webhook.
#
# ───────────────────────────────────────────────────────────────────────────────
# ONE-TIME HUMAN SETUP (do these once, before the first tag push):
#
#  1. Create the PUBLIC repo  goblin-engineering-company/uplink  and push the
#     source there (use scripts/publish-uplink.sh to mirror the clean source).
#
#  2. Generate the updater signing keypair (locally, needs the Tauri CLI):
#         cd uplink && npx tauri signer generate -w ~/.gec/uplink-updater.key
#     It prints a PUBLIC key and writes the PRIVATE key file (with a password).
#
#  3. Put the PUBLIC key into src-tauri/tauri.conf.json → plugins.updater.pubkey
#     (replace the REPLACE_ME_WITH_TAURI_SIGNER_PUBLIC_KEY placeholder), commit,
#     and push. The public key ships inside the app; that is expected + safe.
#
#  4. Add the PRIVATE key + its password as repo secrets (Settings → Secrets and
#     variables → Actions) so CI can sign each build:
#         TAURI_SIGNING_PRIVATE_KEY           = contents of ~/.gec/uplink-updater.key
#         TAURI_SIGNING_PRIVATE_KEY_PASSWORD  = the password you chose in step 2
#
# (Code-signing / notarization is intentionally NOT set up yet. When you add it,
#  it plugs in on the macOS + Windows jobs via extra tauri-action env vars —
#  APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD for
#  macOS notarization, and the Windows cert secrets — see the tauri-action docs.
#  Until then, users get an "unidentified developer" gate on first launch.)
# ───────────────────────────────────────────────────────────────────────────────

name: release

on:
  push:
    tags:
      - "v*"

# Needed so tauri-action can create/update the GitHub Release for the tag.
permissions:
  contents: write

jobs:
  # ── 1. Create the release as a DRAFT (once, before any build) ──
  # Requirement from the CI spec (2026-07-14 §3), escalated to *required* by the
  # v0.2.0-dev.7 incident: a non-draft release goes public the instant the FIRST
  # platform finishes uploading, so a gated (dev/prerelease) build is publicly
  # downloadable for the whole length of the slow mac job — and if the mirror then
  # only partially strips it, it stays public. Creating the draft here (rather than
  # letting each matrix leg create it) also removes the three-way race where all
  # three jobs look up the tag, all miss, and all create their own release.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Create (or reuse) the draft release for this tag
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          # A tag with any suffix (v0.4.0-pre.1, v0.4.0-dev.1) is a prerelease;
          # a plain tag (v0.4.0) is a public release. The server manifest gating
          # controls access per channel — this just marks the GitHub release type.
          # NOTE: this is the ONLY place the channel is derived, exactly as before.
          IS_PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          # A draft release is NOT returned by /releases/tags/{tag}; it only shows
          # in the full release list. Look there so a re-run reuses its draft.
          id="$(gh api "repos/$GH_REPO/releases" --paginate \
                  --jq "map(select(.tag_name == \"$TAG\")) | first | .id // empty")"
          if [ -n "$id" ]; then
            echo "Reusing existing release $id for $TAG"
          else
            args=(--draft --title "GEC Uplink $TAG" --notes "See the assets below to download GEC Uplink for your platform. Installed copies update themselves.")
            if [ "$IS_PRERELEASE" = "true" ]; then args+=(--prerelease); fi
            gh release create "$TAG" "${args[@]}"
            id="$(gh api "repos/$GH_REPO/releases" --paginate \
                    --jq "map(select(.tag_name == \"$TAG\")) | first | .id")"
            echo "Created draft release $id for $TAG"
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: one universal binary (Apple Silicon + Intel in a single .app/.dmg).
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS universal build needs both arch targets.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Linux-only system deps for the webview + bundling (webkit2gtk, appindicator, etc.).
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci

      - name: Build + release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — sign the release + emit the .sig files latest.json points at.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload into the DRAFT the create-release job made. Passing releaseId
          # (instead of tagName) means tauri-action never creates or publishes a
          # release itself — it only attaches this platform's assets + .sig files.
          # The draft/prerelease flags live on that release, set once, up there.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # createUpdaterArtifacts (in tauri.conf.json) makes tauri-action also
          # generate + upload latest.json — the manifest the app's updater reads.
          args: ${{ matrix.args }}

      # Hand the Linux .deb to the Flatpak job below (only ubuntu builds a .deb).
      # Skipped unless the Deck build is opted in (repo variable BUILD_FLATPAK).
      - name: Upload .deb for the Flatpak job
        if: matrix.platform == 'ubuntu-22.04' && vars.BUILD_FLATPAK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uplink-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  # ── 4th target: Steam Deck / Linux Flatpak (OPT-IN) ──
  # Packages the .deb (clean binary) into the GNOME 46 runtime (webkit2gtk 2.44 —
  # the version that renders on SteamOS). Runs in the flatpak-github-actions image
  # which already has the GNOME 46 Platform + SDK. Produces gec-uplink.flatpak and
  # exposes it ONLY as a workflow artifact (Actions run page) — deliberately NOT
  # attached to the GitHub release, so a gated build's release/tag can be stripped
  # cleanly with no re-created husk. Pull the artifact for the Deck (deck-diag.sh).
  # Opt in per build cycle by setting the repo variable BUILD_FLATPAK=true
  # (Settings → Secrets and variables → Actions → Variables, or
  #  gh variable set BUILD_FLATPAK --body true).
  flatpak:
    if: vars.BUILD_FLATPAK == 'true'
    needs: build
    runs-on: ubuntu-22.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the built .deb
        uses: actions/download-artifact@v4
        with:
          name: uplink-deb
          path: deb-in

      - name: Stage the .deb next to the manifest
        run: cp deb-in/*.deb flatpak/gec-uplink.deb

      - name: Fetch shared-modules (libappindicator for the system tray)
        run: git clone --depth 1 https://github.com/flathub/shared-modules.git flatpak/shared-modules

      - name: Build the Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: gec-uplink.flatpak
          manifest-path: flatpak/com.goblinengineering.uplink.yml
          cache-key: flatpak-${{ github.sha }}

      # Expose the Deck build ONLY as a workflow artifact (downloadable from the
      # Actions run page). It is intentionally NOT attached to the GitHub release:
      # the slow flatpak lands after the gated strip has deleted the release, and
      # re-attaching would re-create an orphan husk on the public repo. deck-diag.sh
      # installs from this downloaded artifact.
      - name: Upload .flatpak as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gec-uplink-flatpak
          path: gec-uplink.flatpak

  # ── 3. Publish the draft, once every platform's assets are attached ──
  # `needs: build` uses the DEFAULT success() condition, so this job runs only if
  # all three matrix legs succeeded. Publishing is what fires GitHub's
  # `release: published` webhook, so the droplet's mirror sees the COMPLETE asset
  # list in one event — no partial-mirror window, and the gated strip (which
  # deletes a dev/prerelease release + tag once fully mirrored) shrinks to seconds.
  #
  # It deliberately does NOT wait on the mirror: the mirror is TRIGGERED by this
  # publish (CI → release published → webhook → droplet). Gating publish on the
  # mirror would deadlock. It also deliberately does NOT wait on `flatpak`: that
  # job attaches nothing to the release (artifact-only, by design — see above),
  # and it is opt-in, so requiring it would either stall every release behind a
  # slow container build or hang forever when BUILD_FLATPAK is unset.
  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Flip the draft to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false
          echo "Published $TAG — the mirror webhook now sees the full asset set."

  # ── 4. Clean up after a failed / cancelled run ──
  # TAG LIFECYCLE (spec §3): a tag exists to trigger CI. On a SUCCESSFUL gated
  # release the server deletes the release + tag for us. On a FAILED or cancelled
  # run nothing fires server-side, so the run must clean up after itself —
  # otherwise the tag is poisoned and re-cutting the SAME version collides
  # (dev.5/dev.6 had to be deleted by hand).
  #
  # `if:` uses status-check functions, which is what lets this job run even though
  # `flatpak` may be SKIPPED (BUILD_FLATPAK unset). Normally a job whose `needs`
  # contains a skipped job is itself skipped; a condition containing failure() /
  # cancelled() is evaluated anyway. A skipped job is NOT a failure, so an opted-out
  # flatpak cannot trip this — and cannot hang it either, since a skipped job is a
  # completed job for `needs` purposes.
  #
  # SAFETY: it refuses to touch a release that is already PUBLISHED. That covers
  # the flatpak-failed-after-publish case, and it honours the rule that public
  # release tags are permanent (they anchor the assets + source archive).
  cleanup-failed-run:
    if: failure() || cancelled()
    needs: [create-release, build, flatpak, publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Delete the draft release + tag this run left behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # NOTE: `.draft // empty` would be WRONG here — jq's `//` swallows `false`,
          # so a PUBLISHED release would read as "no release". Stringify instead.
          state="$(gh api "repos/$GH_REPO/releases" --paginate \
                     --jq "map(select(.tag_name == \"$TAG\")) | first | if . == null then \"\" else (.draft | tostring) end" \
                   || echo "")"
          if [ "$state" = "false" ]; then
            echo "::warning::$TAG is already PUBLISHED — leaving the release and tag alone."
            exit 0
          fi
          if [ "$state" = "true" ]; then
            gh release delete "$TAG" --yes
            echo "Deleted draft release $TAG."
          else
            echo "No release found for $TAG (never created, or already stripped)."
          fi
          # Drop the tag so the same version can be re-cut. Tolerate 'already gone'.
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG" \
            && echo "Deleted tag $TAG." \
            || echo "Tag $TAG already gone."
